name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root_password
          MYSQL_DATABASE: contacts_db_test
          MYSQL_USER: contacts_user
          MYSQL_PASSWORD: contacts_password
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: pdo_mysql, mbstring, exif, pcntl, bcmath, gd
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    
    - name: Install Backend Dependencies
      working-directory: ./backend
      run: composer install --no-dev --optimize-autoloader
    
    - name: Install Frontend Dependencies
      working-directory: ./frontend
      run: npm ci
    
    - name: Run Backend Tests
      working-directory: ./backend
      env:
        DB_CONNECTION: mysql
        DB_HOST: 127.0.0.1
        DB_PORT: 3306
        DB_DATABASE: contacts_db_test
        DB_USERNAME: contacts_user
        DB_PASSWORD: contacts_password
      run: |
        cp .env.example .env
        php artisan key:generate
        php artisan migrate --force
        php artisan test
    
    - name: Build Frontend
      working-directory: ./frontend
      run: npm run build

  build:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Build Docker Images
      run: |
        docker build -t ntodo-backend:latest ./backend
        docker build -t ntodo-frontend:latest ./frontend
        echo "Docker images built successfully"
    
    - name: Generate Kubernetes Manifests
      run: |
        echo "Kubernetes manifests ready for deployment:"
        ls -la k8s/
        echo "Deployment would apply these files to cluster"