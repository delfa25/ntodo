name: Deploy

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Build Images
      run: |
        docker build -t ntodo-backend:${{ github.sha }} ./backend
        docker build -t ntodo-frontend:${{ github.sha }} ./frontend
    
    - name: Generate Deployment Files
      run: |
        echo "🚀 Deployment ready for:"
        echo "Backend: ntodo-backend:${{ github.sha }}"
        echo "Frontend: ntodo-frontend:${{ github.sha }}"
        echo "Kubernetes manifests available in k8s/"