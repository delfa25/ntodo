name: Docker Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build Backend
      uses: docker/build-push-action@v5
      with:
        context: ./backend
        push: false
        tags: ntodo-backend:latest
    
    - name: Build Frontend
      uses: docker/build-push-action@v5
      with:
        context: ./frontend
        push: false
        tags: ntodo-frontend:latest