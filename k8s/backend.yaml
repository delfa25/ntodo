apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: ntodo
data:
  APP_ENV: "production"
  APP_DEBUG: "false"
  APP_KEY: "base64:YourAppKeyHere1234567890123456789012345678901234567890="
  DB_CONNECTION: "mysql"
  DB_HOST: "mysql"
  DB_PORT: "3306"
  DB_DATABASE: "contacts_db"
  DB_USERNAME: "contacts_user"
  FRONTEND_URL: "http://localhost:30300"
  CORS_ALLOWED_ORIGINS: "http://localhost:30300,http://localhost:3000"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: ntodo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      initContainers:
      - name: wait-for-mysql
        image: busybox:1.35
        command: ['sh', '-c', 'until nc -z mysql 3306; do echo waiting for mysql; sleep 2; done;']
      containers:
      - name: backend
        image: ntodo-backend:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8000
        env:
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mysql-secret
              key: password
        envFrom:
        - configMapRef:
            name: backend-config
        livenessProbe:
          tcpSocket:
            port: 8000
          initialDelaySeconds: 60
          periodSeconds: 30
        readinessProbe:
          tcpSocket:
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: ntodo
spec:
  selector:
    app: backend
  ports:
  - port: 8000
    targetPort: 8000
    nodePort: 30800
  type: NodePort